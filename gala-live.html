<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gala Live | Breaking Through Roadblocks</title>
<meta name="description" content="Live giving for the Breaking Through Roadblocks Evening of Excellence Gala.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="btr-logo-transparent.png">
<style>
:root{--red:#d0101f;--gold:#e0a82e;--black:#0a0a0a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif}
.gl{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
.gl-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 28px;background:radial-gradient(900px 200px at 0 0,#2a0a0e,#0a0a0a 70%);border-bottom:3px solid var(--red)}
.gl-brand{display:flex;align-items:center;gap:16px;color:#fff;text-decoration:none}
.gl-brand img{width:64px;height:auto}
.gl-brand small{display:block;font-size:.72rem;letter-spacing:.16em;color:var(--gold);font-weight:700}
.gl-brand strong{display:block;font-size:clamp(1.1rem,2.2vw,1.7rem);letter-spacing:-.02em}
.gl-actions{display:flex;gap:10px;flex-wrap:wrap}
.gl-btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:4px;font-weight:700;font-size:.92rem;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.gl-btn.primary{background:var(--red);color:#fff}.gl-btn.ghost{background:transparent;color:#fff;border:1px solid #555}
.gl-frame{position:relative;background:#111}
.gl-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
.gl-foot{display:flex;justify-content:center;gap:10px;padding:10px 20px;font-size:.85rem;color:#bbb;background:var(--black);text-align:center}
.gl-foot a{color:var(--gold)}
:fullscreen .gl-head .gl-actions,:fullscreen .gl-foot{display:none}
@media(max-width:700px){.gl-head{flex-direction:column;align-items:flex-start;padding:12px 16px}.gl-brand img{width:48px}}
</style></head><body>
<div class="gl" id="gl">
<header class="gl-head"><a class="gl-brand" href="index.html"><img src="btr-logo-transparent.png" alt="Breaking Through Roadblocks"><span><small>EVENING OF EXCELLENCE GALA · LIVE GIVING</small><strong>Every gift moves the mission forward.</strong></span></a>
<div class="gl-actions"><button class="gl-btn ghost" id="fs" type="button">Full screen</button><a class="gl-btn primary" href="https://live.givebutter.com/c/test-y6oqbq" target="_blank" rel="noopener">Open live display ↗</a></div></header>
<main class="gl-frame"><iframe src="https://live.givebutter.com/c/test-y6oqbq" title="Breaking Through Roadblocks live giving display" allow="fullscreen" allowfullscreen></iframe></main>
<footer class="gl-foot"><span>If the live display doesn’t appear, <a href="https://live.givebutter.com/c/test-y6oqbq" target="_blank" rel="noopener">open it here</a>.</span></footer>
</div>
<script>
document.getElementById('fs').addEventListener('click',()=>{const e=document.getElementById('gl');(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e);});
</script>
</body></html>
